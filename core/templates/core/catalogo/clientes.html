{% extends "core/base.html" %}
{% block titulo %}Clientes{% endblock %}
{% block contenido %}
<div class="titulo-seccion mb-3">
  <h1>Clientes</h1>
  <span class="badge badge-pg">PostgreSQL</span>
</div>
<div class="row g-3">
  <div class="col-lg-4">
    <div class="card">
      <div class="card-header"><strong>Nuevo cliente</strong></div>
      <form method="post" class="card-body">
        {% csrf_token %}
        <label class="form-label small mb-0">Nombre</label>
        <input name="nombre" class="form-control form-control-sm mb-2" maxlength="140" required>
        <label class="form-label small mb-0">Identificación (cédula o RUC)</label>
        <input name="identificacion" class="form-control form-control-sm mb-2" maxlength="13" required>
        <label class="form-label small mb-0">Tipo</label>
        <select name="tipo" class="form-select form-select-sm mb-2">
          <option value="minorista">minorista</option>
          <option value="mayorista">mayorista</option>
        </select>
        <button class="btn btn-primary btn-sm">Crear</button>
      </form>
    </div>
  </div>
  <div class="col-lg-8">
    <div class="table-responsive">
    <table class="table table-sm table-hover bg-white">
      <thead class="table-light"><tr><th>ID</th><th>Nombre</th><th>Identificación</th><th>Tipo</th><th></th></tr></thead>
      <tbody>
      {% for c in clientes %}
        <tr><td>{{ c.id_cliente }}</td><td>{{ c.nombre }}</td><td>{{ c.identificacion }}</td><td>{{ c.tipo }}</td>
          <td class="text-end"><a class="btn btn-outline-secondary btn-sm py-0" href="{% url 'saldo_cliente' c.id_cliente %}">Saldo</a></td></tr>
      {% endfor %}
      </tbody>
    </table>
    </div>
  </div>
</div>
{% endblock %}
